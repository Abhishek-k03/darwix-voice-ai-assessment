# Hindi lines (Devanagari) for the Sarvam voice. Missing keys fall back to the English pack.
greeting: >-
  नमस्ते, मैं {persona} बोल रही हूँ, {company} की AI असिस्टेंट। यह कॉल क्वालिटी और ट्रेनिंग के लिए रिकॉर्ड की जा रही है।
  आपने हाल ही में हेल्थ इंश्योरेंस के बारे में पूछा था, क्या अभी कुछ मिनट बात करने का अच्छा समय है?
fallback: >-
  माफ़ कीजिए, इस बारे में मेरे पास अभी सही जानकारी नहीं है। मैं इसे नोट कर लेती हूँ, ताकि लाइसेंस प्राप्त सलाहकार आपसे इस पर बात करें।
out_of_scope: >-
  यह इस कॉल में मेरी मदद के दायरे से बाहर है। मैं हेल्थ इंश्योरेंस प्लान, पात्रता और प्रीमियम में आपकी मदद कर सकती हूँ।
escalation: >-
  ज़रूर, मैं आपको अभी लाइसेंस प्राप्त सलाहकार से जोड़ रही हूँ। कृपया लाइन पर बने रहिए, उनके पास हमारी अब तक की बातचीत की पूरी जानकारी होगी।
escalation_unavailable: >-
  हमारे सलाहकार अभी व्यस्त हैं, इसलिए मैंने दो घंटे के भीतर प्राथमिकता वाली कॉलबैक तय कर दी है। आपके धैर्य के लिए धन्यवाद।
dnc: >-
  समझ गई, मैंने नोट कर लिया है कि आप हमसे आगे कॉल नहीं चाहते। असुविधा के लिए क्षमा करें, आपका दिन शुभ हो।
callback_confirm: >-
  ठीक है, लाइसेंस प्राप्त सलाहकार आपको {when} कॉल करेंगे। आपके समय के लिए धन्यवाद, अपना ध्यान रखिए।
not_interested_close: >-
  कोई बात नहीं, आपके समय के लिए धन्यवाद। आगे कभी हेल्थ कवर चाहिए हो तो हमारे टोल-फ़्री नंबर पर कॉल कर सकते हैं। आपका दिन शुभ हो।
closing: >-
  आपके समय के लिए धन्यवाद। आपका दिन शुभ हो।
reconfirm: >-
  बस पुष्टि के लिए, पहले मैंने {field} {old} नोट किया था, और अब मैंने {new} सुना। इनमें से सही कौन सा है?
reprompt: >-
  माफ़ कीजिए, मुझे सुनाई नहीं दिया। क्या आप लाइन पर हैं?
escalation_hold: >-
  धन्यवाद, कृपया लाइन पर बने रहिए। सलाहकार जल्द ही आपसे जुड़ेंगे।

