extraction_hints: >
  Customer may speak formal or colloquial Indonesian with English loanwords, sometimes Javanese/Sundanese words:
  "iya/nggih/inggih/he eh" = yes, "nggak/gak/mboten/teu" = no, "udah/sampun" = already, "gajian" = payday,
  "tanggal muda" = early in the month, "bulan depan" = next month. Channels: "VA/virtual account/transfer BCA"->virtual_account,
  Indomaret->indomaret, Alfamart->alfamart, "aplikasi/MajuKu"->app, GoPay/OVO/DANA/ShopeePay->ewallet, "kantor pos"->kantor_pos.
  Keep dates as said ("tanggal 25", "Jumat", "minggu depan").
