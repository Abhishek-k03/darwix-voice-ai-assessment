extraction_hints: >
  The customer may speak Filipino, English or Taglish. "opo/oo/sige" = yes, "hindi po/ayoko" = no.
  "sa sweldo/sa kinsenas/sa a-kinse" = on payday (the 15th); "katapusan" = end of month.
  Map payment channels: GCash->gcash, Maya/PayMaya->maya, "sa bangko/sa branch"->branch,
  "online/app ng bangko"->online_banking, "auto-debit/ADA"->auto_debit, "Bayad Center"->bayad_center.
  Dates may be said like "sa 15", "sa Biyernes", "next week" — keep them as said.
