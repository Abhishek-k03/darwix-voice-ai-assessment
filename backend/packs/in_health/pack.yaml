extraction_hints: >
  Indian customers may use Hinglish ("haan", "nahi", "ji", "bas", "theek hai") and lakh/crore amounts
  ("15 hazaar" = 15000, "2 lakh" = 200000). Ages and amounts can be spoken in words.
  A budget that mixes a total and a yearly figure ("total budget 5 lakh, otherwise 15000") is the yearly premium: 15000.
  children_count counts only people called son, daughter, child or kid; a name right after "my wife" / "my husband"
  is the spouse's name, and repeating the same child does not add one. Adding members widens cover_for
  (e.g. self_spouse -> family) and is not a correction.
