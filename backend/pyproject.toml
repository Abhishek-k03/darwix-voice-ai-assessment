[project]
name = "darwix-voice-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "azure-cognitiveservices-speech>=1.52.0",
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "datasketch>=2.0.0",
    "en-core-web-sm",
    "fastapi>=0.142.2",
    "fastembed>=0.8.1",
    "httpx>=0.28.1",
    "jiwer>=4.0.0",
    "livekit-agents>=1.8.3",
    "livekit-api>=1.2.1",
    "livekit-plugins-azure>=1.8.3",
    "livekit-plugins-deepgram>=1.8.3",
    "livekit-plugins-openai>=1.8.3",
    "livekit-plugins-silero>=1.8.3",
    "msgpack>=1.2.3",
    "num2words>=0.5.14",
    "numpy>=2.5.3",
    "openai>=2.54.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pdfplumber>=0.11.10",
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.364",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "soundfile>=0.14.0",
    "spacy>=3.8.16",
    "trafilatura>=2.2.0",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.1",
]

[dependency-groups]
dev = [
    "reportlab>=5.0.1",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
